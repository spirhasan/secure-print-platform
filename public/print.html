<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Print Session</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-page"><section class="panel" style="width:min(680px,94vw);padding:30px" id="printApp"><div class="brand"><span class="brand-mark">⌁</span> SecurePrint <span class="badge" style="margin-left:auto">PRINT-ONLY</span></div><div id="state" class="empty">Secure print session তৈরি হচ্ছে…</div></section></main><script>const code=location.pathname.split('/').pop(),state=document.querySelector('#state');(async()=>{try{const r=await fetch('/api/print/'+code);const d=await r.json();if(!r.ok)throw Error(d.error);state.innerHTML='<div class="eyebrow">SECURE PRODUCT ACCESS</div><h1 style="font-family:Plus Jakarta Sans">'+d.product.productName+'</h1><p class="muted">Customer: '+d.product.customerName+' · Session: '+d.sessionId+'</p><div style="background:#f7f7fb;border-radius:15px;padding:18px;margin:22px 0"><img src="'+d.product.image+'" style="display:block;max-width:100%;max-height:420px;margin:auto;border-radius:10px" oncontextmenu="return false"></div><div class="notice">এই পেজে কোনো download link নেই। আপনার print session ৬০ সেকেন্ডের জন্য সক্রিয়।</div><button class="primary" id="print" style="width:100%;margin-top:15px">PRINT NOW →</button>';document.querySelector('#print').onclick=async()=>{window.print();await fetch('/api/print/'+d.sessionId+'/complete',{method:'POST'});document.querySelector('#print').disabled=true;document.querySelector('#print').textContent='PRINT SESSION USED'} }catch(e){state.innerHTML='<div class="notice error">'+e.message+'</div>'}})()</script></body></html>
